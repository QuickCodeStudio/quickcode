# VM / production overlay. Databases, Kafka, and Elasticsearch are not started here.
# docker compose -f docker-compose.yml -f docker-compose.vm.yml --env-file .env up -d --build
# Do not use docker-compose.override.yml on the VM (local Rider / published DB ports).

services:
  quickcode-gateway-api:
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PRIVATE_KEY=${GATEWAY_JWT_PRIVATE_KEY}
      - GATEWAY_INTERNAL_TOKEN_KEY=${GATEWAY_INTERNAL_TOKEN_KEY}
      - ELASTIC_CONNECTION_STRING=${QUICKCODE_GATEWAY_ELASTIC:-${ELASTIC_CONNECTION_STRING:-}}
    ports:
      - "${GATEWAY_PORT:-6060}:80"

  quickcode-module-api:
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      
      
      - READ_CONNECTION_STRING=${QUICKCODE_QUICKCODE_MODULE_DB}
      - WRITE_CONNECTION_STRING=${QUICKCODE_QUICKCODE_MODULE_DB}
      - ELASTIC_CONNECTION_STRING=${QUICKCODE_QUICKCODE_MODULE_ELASTIC:-}

  quickcode-identity-module-api:
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      - USER_JWT_PRIVATE_KEY=${USER_JWT_PRIVATE_KEY}
      - QUICKCODE_EMAIL_API_KEY=${QUICKCODE_EMAIL_API_KEY}
      - READ_CONNECTION_STRING=${QUICKCODE_IDENTITY_MODULE_DB}
      - WRITE_CONNECTION_STRING=${QUICKCODE_IDENTITY_MODULE_DB}
      - ELASTIC_CONNECTION_STRING=${QUICKCODE_IDENTITY_MODULE_ELASTIC:-}

  quickcode-portal:
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+
      - ELASTIC_CONNECTION_STRING=${QUICKCODE_PORTAL_ELASTIC:-${ELASTIC_CONNECTION_STRING:-}}
      - BLOB_PROVIDER=${BLOB_PROVIDER:-azure}
      - AZURE_ACCOUNT_NAME=${AZURE_ACCOUNT_NAME:-quickcodeblobstorage}
      - AZURE_ACCOUNT_KEY=${AZURE_ACCOUNT_KEY}
      - AZURE_BLOB_CONTAINER_NAME=${AZURE_BLOB_CONTAINER_NAME:-images}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET:-quickcode-images}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
      - R2_KEY_PREFIX=${R2_KEY_PREFIX}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-quickcode-images}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL}
      - LOCAL_PUBLIC_BASE_URL=${LOCAL_PUBLIC_BASE_URL:-/uploads}
    ports:
      - "${PORTAL_PORT:-6020}:80"

  quickcode-event-listener-service:
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+
      - GATEWAY_INTERNAL_TOKEN_KEY=${GATEWAY_INTERNAL_TOKEN_KEY}
      - ELASTIC_CONNECTION_STRING=${QUICKCODE_EVENT_LISTENER_SERVICE_ELASTIC:-${ELASTIC_CONNECTION_STRING:-}}
    ports:
      - "${EVENT_LISTENER_PORT:-6100}:80"
