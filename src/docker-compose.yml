      context: .
      dockerfile: Presentation/QuickCode.QuickCode.Gateway/Dockerfile

  quickcode-quickcode-quick-code-module-api:
    container_name: "quickcode-quickcode-quick-code-module-api"
    image: ${DOCKER_REGISTRY-}quickcode-quickcode-quick-code-module-api
