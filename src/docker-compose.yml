      context: . 
      dockerfile: Modules/QuickCodeModule/Presentation/QuickCode.QuickCode.QuickCodeModule.Api/Dockerfile

  quickcode-quickcode-identity-module-api:
    container_name: "quickcode-quickcode-identity-module-api"
